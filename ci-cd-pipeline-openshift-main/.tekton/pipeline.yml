apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: oc-pipelines-oc-final
spec:
  workspaces:
    - name: source
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: source
    - name: nose
      runAfter:
        - cleanup
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: source
